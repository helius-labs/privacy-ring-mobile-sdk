[package]
name = "spr-mobile"
version = "0.1.0"
description = "Flutter-facing bindings for Zolana transaction construction and local proving."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana-mobile-sdk"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# zopro's stage timings in the device log (the Device Farm bench).
zopro-trace = ["spr-local-prover/zopro-trace"]
default = []
flutter = ["dep:mopro-ffi", "mopro-ffi/flutter"]

[dependencies]
async-trait = "0.1"
flutter_rust_bridge = "=2.11.1"
futures-executor = "0.3"
http = "1"
hex = "0.4"
hmac = "0.12"
bytemuck = "1"
mopro-ffi = { git = "https://github.com/sergeytimoshin/mopro", rev = "c1071f96fa5a28dca8e567dd3944331047450a2b", optional = true }
# Only its types: the wallet sends through the application's transport.
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = "0.4"
spr-local-prover = { path = "../spr-local-prover", features = ["device-allocator"] }
serde = { version = "1.0", features = ["derive"] }
solana-account = "4.3"
solana-commitment-config = "3.1"
solana-instruction = "3.4"
solana-message = "4.2"
solana-rpc-client = "4.2"
solana-rpc-client-api = "4.2"
solana-transaction-error = "3.3"
solana-transaction = "4.1"
solana-transaction-status-client-types = "4.1"
serde_json = "1.0"
sha2 = "0.10"
zeroize = "1.9"
solana-address = "=2.6.1"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
wincode = "=0.5.5"
spr-hasher = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["std"] }
spr-interface = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["borsh"] }
spr-keypair = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-program = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-api = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-client = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["client"] }
spr-transaction = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
solana-keypair = "3"
solana-signer = "3.0"

[[bin]]
name = "flutter"
path = "src/bin/flutter.rs"
required-features = ["flutter"]

# The frb attribute macro leaves a `cfg(frb_expand)` behind.
[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(frb_expand)"]
level = "warn"
