[package]
name = "prove-fixtures"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes the /prove request fixtures the proof timing harness proves."

# Built on its own, not with the SDK: it pulls the Zolana client's tree
# crates for a one-off run.
[workspace]

[dependencies]
num-bigint = "0.4"
solana-address = "=2.6.1"
solana-signature = "=3.4.1"
zolana-client = { package = "spr-client", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537", features = ["client"] }
zolana-hasher = { package = "spr-hasher", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537", features = ["std"] }
zolana-interface = { package = "spr-interface", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537" }
zolana-keypair = { package = "spr-keypair", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537" }
zolana-merkle-tree = { package = "spr-merkle-tree", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537" }
zolana-transaction = { package = "spr-transaction", git = "https://github.com/helius-labs/zolana", rev = "3b022ff2fd81c18786caa79fb4754437c6056537" }
