[package]
name = "prove-fixtures"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes the /prove request fixtures the proof timing harness proves."

# Built on its own, not with the SDK: it pulls the Zolana client's tree
# crates for a one-off run.
[workspace]

[dependencies]
num-bigint = "0.4"
solana-address = "=2.6.1"
solana-signature = "=3.4.1"
spr-client = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["client"] }
spr-hasher = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["std"] }
spr-interface = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-keypair = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-transaction = { git = "https://github.com/helius-labs/zolana", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
